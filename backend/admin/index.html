<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AbbaKano Admin</title>
<style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#17212b;background:#f3f5f7;--line:#d9e0e6;--card:#fff;--muted:#667482;--brand:#0d5f5b;--soft:#e4f1ef;box-sizing:border-box}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{background:#14252a;color:#edf8f5;padding:24px 16px}.brand{font-size:19px;font-weight:800;margin:0 10px 26px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#a9c1bf;text-align:left;padding:11px 12px;border-radius:7px}.nav button.active,.nav button:hover{background:#1e4546;color:#fff}.main{padding:25px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.top h1{font-size:24px;margin:0}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:16px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:24px;margin-top:7px}.content{margin-top:16px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{color:var(--muted);font-weight:650}.pill{display:inline-block;border-radius:99px;padding:3px 8px;font-size:11px;font-weight:700;background:#edf1f3}.pill.success,.pill.active{background:#def3e6;color:#176c3e}.pill.failed,.pill.blocked{background:#fae5e3;color:#a62d27}.pill.pending{background:#fff1d4;color:#8b5b00}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:13px}.field{border:1px solid var(--line);border-radius:6px;padding:9px 10px;background:#fff}.btn{border:0;border-radius:6px;padding:9px 13px;background:var(--brand);color:#fff;font-weight:700}.btn.secondary{background:#fff;color:#17212b;border:1px solid var(--line)}.btn.danger{background:#b3261e}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(390px,100%);background:#fff;border:1px solid var(--line);border-radius:10px;padding:25px}.login-card h1{margin:0 0 6px}.login-card form{display:grid;gap:12px;margin-top:20px}.error{color:#b3261e;font-size:13px}.toast{position:fixed;right:20px;bottom:20px;background:#14252a;color:#fff;padding:12px 15px;border-radius:7px}.chart{display:flex;align-items:end;gap:5px;height:150px}.bar-chart{flex:1;background:#a7d9d3;min-height:3px;border-radius:4px 4px 0 0;position:relative}.bar-chart small{position:absolute;top:100%;margin-top:5px;font-size:9px;color:var(--muted);transform:rotate(-45deg)}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;padding:12px}.brand{display:inline-block;margin:4px 18px 4px 4px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.main{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.top h1{font-size:20px}.card{padding:12px}.table th,.table td{padding:8px 7px}}
</style>
</head>
<body>
<div id="login" class="login"><section class="login-card"><h1>Admin Console</h1><p class="muted">Sign in with an administrator account.</p><form id="loginForm"><input class="field" name="identifier" placeholder="Email or username" required><input class="field" name="password" type="password" placeholder="Password" required><button class="btn">Sign in</button><div id="loginError" class="error"></div></form></section></div>
<div id="app" class="shell hidden"><aside class="side"><div class="brand">AbbaKano Admin</div><nav class="nav"><button data-view="overview" class="active">Overview</button><button data-view="users">Users</button><button data-view="transactions">Transactions</button><button data-view="audit">Audit log</button></nav><button id="logout" class="btn secondary" style="margin-top:25px;width:100%">Sign out</button></aside><main class="main"><header class="top"><div><h1 id="title">Overview</h1><div id="identity" class="muted"></div></div><button id="refresh" class="btn secondary">Refresh</button></header><section id="view"></section></main></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s), view=$('#view');let active='overview';
async function api(path,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};if(['POST','PUT','PATCH','DELETE'].includes((options.method||'GET').toUpperCase())&&path!=='/login'){const csrf=await fetch('/csrf',{credentials:'include'}).then(r=>r.json());if(csrf.csrfToken)headers['X-CSRF-Token']=csrf.csrfToken}const response=await fetch(path,{credentials:'include',headers,...options});if(response.status===401||response.status===403)throw new Error('Admin authentication required');const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||'Request failed');return data}
function money(value){return 'NGN '+Number(value||0).toLocaleString('en-NG',{minimumFractionDigits:2})}function pill(value){return `<span class="pill ${String(value).toLowerCase()}">${value}</span>`}function toast(message){const el=$('#toast');el.textContent=message;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2200)}
async function boot(){try{const data=await api('/admin/auth/me');$('#identity').textContent=`${data.admin.full_name||data.admin.username} · admin`;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await render()}catch{$('#login').classList.remove('hidden');$('#app').classList.add('hidden')}}
async function render(){const labels={overview:'Overview',users:'Users',transactions:'Transactions',audit:'Audit log'};$('#title').textContent=labels[active];document.querySelectorAll('.nav button').forEach(button=>button.classList.toggle('active',button.dataset.view===active));if(active==='overview')return overview();if(active==='users')return users();if(active==='transactions')return transactions();return audit()}
async function overview(){const [summary,today,trend,revenue]=await Promise.all([api('/admin/dashboard/summary'),api('/admin/dashboard/today'),api('/admin/dashboard/trend?days=14'),api('/admin/dashboard/revenue-by-type')]);const max=Math.max(...trend.trend.map(x=>x.volume),1);view.innerHTML=`<div class="grid">${[['Users',summary.summary.users],['Active users',summary.summary.activeUsers],['Deposits',summary.summary.depositVolume&&money(summary.summary.depositVolume)],['Transactions',summary.summary.transactions],['Success',summary.summary.successful],['Pending',summary.summary.pending],['Failed',summary.summary.failed],['VTU volume',money(summary.summary.transactionVolume)]].map(x=>`<article class="card metric"><span>${x[0]}</span><strong>${x[1]}</strong></article>`).join('')}</div><div class="content grid" style="grid-template-columns:2fr 1fr"><article class="card"><h3>Successful volume, last 14 days</h3><div class="chart">${trend.trend.map(x=>`<div class="bar-chart" style="height:${Math.max(3,x.volume/max*125)}px"><small>${String(x.date).slice(5)}</small></div>`).join('')}</div></article><article class="card"><h3>Revenue by type</h3>${revenue.revenue.map(x=>`<p><b>${x.type}</b><br><span class="muted">${money(x.volume)} · ${x.count} transactions</span></p>`).join('')||'<p class="muted">No data yet.</p>'}</article></div><div class="content card"><b>Today:</b> ${today.today.transactions} transactions · ${money(today.today.volume)} successful volume · ${today.today.activeUsers} active users</div>`}
async function users(){const data=await api('/admin/users?limit=100');view.innerHTML=`<article class="card"><div class="toolbar"><input id="userSearch" class="field" placeholder="Search users"><select id="userStatus" class="field"><option value="">All statuses</option><option>active</option><option>blocked</option></select><button id="userFilter" class="btn">Filter</button></div><div id="userTable"></div></article>`;const draw=async()=>{const params=new URLSearchParams({limit:'100'});if($('#userSearch').value)params.set('search',$('#userSearch').value);if($('#userStatus').value)params.set('status',$('#userStatus').value);const rows=(await api('/admin/users?'+params)).users;$('#userTable').innerHTML=`<div class="table-wrap"><table class="table"><tr><th>User</th><th>Phone</th><th>Balance</th><th>Status</th><th>Joined</th><th></th></tr>${rows.map(u=>`<tr><td>${u.full_name||u.username}<br><span class="muted">${u.email||''}</span></td><td>${u.phone||''}</td><td>${money(u.balance)}</td><td>${pill(u.status)}</td><td>${String(u.created_at).slice(0,10)}</td><td><button class="btn secondary" data-block="${u.id}" data-next="${u.status==='active'?'blocked':'active'}">${u.status==='active'?'Block':'Restore'}</button></td></tr>`).join('')}</table></div>`;document.querySelectorAll('[data-block]').forEach(button=>button.onclick=async()=>{try{await api('/admin/users/'+button.dataset.block+'/status',{method:'PATCH',body:JSON.stringify({status:button.dataset.next})});toast('User status updated');draw()}catch(e){toast(e.message)}})};$('#userFilter').onclick=draw;draw()}
async function transactions(){const data=await api('/admin/transactions');view.innerHTML=`<article class="card"><div class="table-wrap"><table class="table"><tr><th>Reference</th><th>User</th><th>Type</th><th>Network</th><th>Amount</th><th>Status</th><th>Date</th></tr>${data.transactions.map(t=>`<tr><td>${t.id}</td><td>${t.username}</td><td>${t.type}</td><td>${t.network}</td><td>${money(t.amount)}</td><td>${pill(t.status)}</td><td>${String(t.created_at).slice(0,19).replace('T',' ')}</td></tr>`).join('')}</table></div></article>`}
async function audit(){const data=await api('/admin/audit-log');view.innerHTML=`<article class="card"><div class="table-wrap"><table class="table"><tr><th>When</th><th>Actor</th><th>Action</th><th>Details</th><th>IP</th></tr>${data.auditLog.map(a=>`<tr><td>${String(a.created_at).slice(0,19).replace('T',' ')}</td><td>${a.actor||''}</td><td>${a.action}</td><td>${JSON.stringify(a.details||{})}</td><td>${a.ip_address||''}</td></tr>`).join('')}</table></div></article>`}
document.querySelectorAll('.nav button').forEach(button=>button.onclick=()=>{active=button.dataset.view;render().catch(e=>toast(e.message))});$('#refresh').onclick=()=>render().catch(e=>toast(e.message));$('#logout').onclick=async()=>{await api('/admin/auth/logout',{method:'POST'}).catch(()=>{});location.reload()};$('#loginForm').onsubmit=async(event)=>{event.preventDefault();const body=Object.fromEntries(new FormData(event.currentTarget));try{await api('/login',{method:'POST',body:JSON.stringify(body)});await boot()}catch(e){$('#loginError').textContent=e.message}};boot();
</script>
</body></html>
