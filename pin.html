<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Admin dashboard</title>
<style>
:root{--bg:#eef1f4;--sf:#fff;--ink:#15202b;--mu:#5d6b79;--ln:#dbe1e7;--pr:#0d5f5b;--pr2:#e0f0ef;--wa:#8a5a00;--wa2:#fcefcf;--er:#b3261e;--er2:#fbe4e2;--ok:#1b7f45;--ok2:#dcf1e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f161d;--sf:#18222c;--ink:#e6edf3;--mu:#94a3b1;--ln:#2a3846;--pr:#4fc3bc;--pr2:#16393a;--wa:#f0b93a;--wa2:#3a2f12;--er:#ff8a80;--er2:#3d1b19;--ok:#5fd18a;--ok2:#163524}}
:root[data-theme=dark]{--bg:#0f161d;--sf:#18222c;--ink:#e6edf3;--mu:#94a3b1;--ln:#2a3846;--pr:#4fc3bc;--pr2:#16393a;--wa:#f0b93a;--wa2:#3a2f12;--er:#ff8a80;--er2:#3d1b19;--ok:#5fd18a;--ok2:#163524}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
nav{background:var(--sf);border-right:1px solid var(--ln);padding:16px 10px;position:sticky;top:0;height:100vh}
nav h1{font-size:16px;margin:0 8px 14px;letter-spacing:-.01em}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--mu);padding:9px 10px;border-radius:6px;font:inherit;cursor:pointer}
nav button.on{background:var(--pr2);color:var(--pr);font-weight:600}
nav button:hover{color:var(--ink)}
main{padding:20px;min-width:0}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
h2{font-size:20px;margin:0;letter-spacing:-.01em}h3{font-size:14px;margin:0 0 10px}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:7px 9px;min-width:0}
textarea{width:100%}
:focus-visible{outline:2px solid var(--pr);outline-offset:1px}
.btn{background:var(--pr);color:var(--sf);border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn.g{background:none;color:var(--ink);border:1px solid var(--ln)}.btn.d{background:var(--er);color:var(--sf)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:12px}
.k small{color:var(--mu);display:block}.k b{font-size:19px;font-variant-numeric:tabular-nums}
.k.w{background:var(--wa2);border-color:var(--wa)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}
th{text-align:left;color:var(--mu);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--ln)}
td{padding:8px 10px;border-bottom:1px solid var(--ln);font-variant-numeric:tabular-nums}
tr.c{cursor:pointer}tr.c:hover td{background:var(--bg)}
.bd{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600}
.success,.active,.resolved{background:var(--ok2);color:var(--ok)}.pending,.reviewing{background:var(--wa2);color:var(--wa)}.failed,.blocked,.open{background:var(--er2);color:var(--er)}.dismissed{background:var(--bg);color:var(--mu)}
.mu{color:var(--mu)}.cr{color:var(--ok)}.dr{color:var(--er)}
.ov{position:fixed;inset:0;background:#0007;display:flex;justify-content:flex-end;z-index:9}
.dw{background:var(--sf);width:min(460px,100%);height:100%;overflow:auto;padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.dw .x{float:right}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;z-index:20}
.f{display:grid;grid-template-columns:1fr 130px;gap:8px 12px;align-items:center;max-width:520px}
@media(max-width:760px){.app{display:block}nav{position:static;height:auto;display:flex;overflow-x:auto;gap:4px;padding:8px;border-right:0;border-bottom:1px solid var(--ln)}nav h1{display:none}nav button{width:auto;white-space:nowrap}.two{grid-template-columns:1fr}main{padding:14px}}
</style></head><body>
<div class="app"><nav id="nav"></nav><main><header><h2 id="ttl"></h2><label class="mu">Signed in as <select id="role"></select></label></header><div id="v"></div></main></div>
<script>
let sd=7;const rnd=()=>(sd=sd*16807%2147483647)/2147483647,pick=a=>a[Math.floor(rnd()*a.length)];
const N=n=>'₦'+Math.round(n).toLocaleString('en-NG'),$=id=>document.getElementById(id);
const now=Date.now(),H=36e5,D=864e5,day0=new Date().setHours(0,0,0,0);
const fd=t=>new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const names='Adaeze Okafor,Tunde Bakare,Halima Yusuf,Chinedu Eze,Bola Adeyemi,Ngozi Nwosu,Ibrahim Musa,Funke Alade,Emeka Obi,Zainab Lawal,Segun Ojo,Amaka Udo,Yusuf Garba,Kemi Balogun,David Ita,Sade Coker,Musa Danjuma,Ify Okonkwo,Lanre Salami,Hauwa Bello,Peter Agu,Tola Ige,Ada Nnadi,Sani Abdul,Rita Effiong,Jide Fashola,Maryam Sule,Uche Okoro,Femi Ajayi,Blessing Etim'.split(',');
const U=names.map((n,i)=>({id:'U'+(1001+i),name:n,email:n.toLowerCase().replace(' ','.')+'@mail.com',phone:'080'+Math.floor(1e7+rnd()*9e7),joined:now-(20+rnd()*300)*D,status:rnd()<.13?'blocked':'active',bal:Math.round(300+rnd()*90000)}));
const TY={Airtime:[100,5000],Data:[500,10000],Electricity:[2000,30000],'Cable TV':[2000,15000],Deposit:[2000,100000],Withdrawal:[5000,80000]};
let T=[],tn=5000;
const mk=(u,ty,amt,ts,st)=>T.push({id:'TX'+(tn++),u:u.id,ty,amt:Math.round(amt/50)*50,ts,st:st||(rnd()<.84?'success':rnd()<.5?'pending':'failed')});
for(let i=0;i<170;i++){const ty=pick(Object.keys(TY)),r=TY[ty];mk(pick(U),ty,r[0]+rnd()*(r[1]-r[0]),now-Math.pow(rnd(),1.3)*14*D)}
for(let i=0;i<7;i++)mk(U[6],'Airtime',1000,now-D-i*70000,'success');
mk(U[11],'Deposit',350000,now-5*H,'success');
T.sort((a,b)=>b.ts-a.ts);
let LG=[],AU=[],cfg={minFund:1000,maxFund:500000,dailyWd:200000,perTx:100000,lowUser:1000,lowProv:500000},prov=1240000;
const roles={'Super admin':['plans.edit','users.block','balance.adjust','cases.resolve','settings.edit','roles.edit'],Finance:['balance.adjust','cases.resolve'],Support:['users.block'],Analyst:[]};
const PN={'plans.edit':'Set data plan prices','users.block':'Block or unblock users','balance.adjust':'Adjust balances','cases.resolve':'Review and resolve risk cases','settings.edit':'Edit limits and alerts','roles.edit':'Edit roles and permissions'};
let role='Super admin',view='ov',IP='102.89.34.17';const can=p=>roles[role].includes(p);
const uu=id=>U.find(u=>u.id===id),bd=s=>`<span class="bd ${s}">${s}</span>`;
function log(action,target,before,after){AU.unshift({ts:Date.now(),who:'admin · '+role,action,target,before,after,ip:IP})}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
// risk cases
let CS=[],cn=1;
function scan(){U.forEach(u=>{const t=T.filter(x=>x.u===u.id).sort((a,b)=>a.ts-b.ts);
 for(let i=0;i+4<t.length;i++)if(t[i+4].ts-t[i].ts<=10*60000){addCase(u,'Rapid transactions',`${t.filter(x=>x.ts>=t[i].ts&&x.ts<=t[i].ts+10*60000).length} transactions within 10 minutes`,t[i].ts);break}
 if(t.length>=4){t.forEach(x=>{const o=t.filter(y=>y!==x),av=o.reduce((a,y)=>a+y.amt,0)/o.length;if(x.amt>=100000&&x.amt>4*av)addCase(u,'Unusual amount',`${N(x.amt)} is ${(x.amt/av).toFixed(1)}× this user's average of ${N(av)} (${x.id})`,x.ts)})}})
 CS.sort((a,b)=>b.ts-a.ts)}
function addCase(u,kind,detail,ts){if(CS.some(c=>c.u===u.id&&c.kind===kind&&c.detail===detail))return;CS.push({id:'C'+(100+cn++),u:u.id,kind,detail,ts,st:'open',notes:[]})}
scan();
// nav
const NV=[['ov','Overview'],['us','Users'],['tx','Transactions'],['an','Analytics'],['rk','Risk cases'],['au','Audit log'],['dp','Data plans'],['st','Settings']];
$('role').innerHTML=Object.keys(roles).map(r=>`<option>${r}</option>`).join('');
$('role').onchange=e=>{role=e.target.value;go(view)};
function go(v){view=v;$('nav').innerHTML='<h1>Admin</h1>'+NV.map(n=>`<button class="${n[0]===v?'on':''}" onclick="go('${n[0]}')">${n[1]}${n[0]==='rk'?' ('+CS.filter(c=>c.st!=='resolved'&&c.st!=='dismissed').length+')':''}</button>`).join('');$('ttl').textContent=NV.find(n=>n[0]===v)[1];({ov,us,tx,an,rk,au,dp,st})[v]()}
const tbl=(h,r,e)=>r.length?`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.join('')}</table></div>`:`<p class="mu">${e||'Nothing matches these filters. Clear a filter to see more.'}</p>`;
const txRow=t=>`<tr class="c" onclick="openUser('${t.u}')"><td>${t.id}</td><td>${uu(t.u).name}</td><td>${t.ty}</td><td>${N(t.amt)}</td><td>${bd(t.st)}</td><td>${fd(t.ts)}</td></tr>`;
const TH=['ID','User','Type','Amount','Status','Date'];
// overview
function ov(){const ok=T.filter(t=>t.st==='success'),s=f=>ok.filter(f).reduce((a,t)=>a+t.amt,0),td=T.filter(t=>t.ts>=day0),tdOk=td.filter(t=>t.st==='success');
const K=(l,v,w)=>`<div class="k ${w?'w':''}"><small>${l}</small><b>${v}</b></div>`,low=prov<cfg.lowProv;
$('v').innerHTML=(low?`<div class="card" style="background:var(--wa2)">VTU provider balance is below your ${N(cfg.lowProv)} alert threshold. Top up to keep purchases running.</div>`:'')+`<div class="grid">${K('Total users',U.length)}${K('Active users',U.filter(u=>u.status==='active').length)}${K('Blocked users',U.filter(u=>u.status==='blocked').length)}${K('Total deposits',N(s(t=>t.ty==='Deposit')))}${K('Total withdrawals',N(s(t=>t.ty==='Withdrawal')))}${K('Transaction volume',N(s(()=>1)))}${K('Successful',ok.length)}${K('Pending',T.filter(t=>t.st==='pending').length)}${K('Failed',T.filter(t=>t.st==='failed').length)}${K('VTU provider balance',N(prov),low)}</div>
<div class="card"><h3>Today's activity</h3><div class="row"><span>${td.length} transactions</span><span class="mu">·</span><span>${N(tdOk.reduce((a,t)=>a+t.amt,0))} successful volume</span><span class="mu">·</span><span>${new Set(td.map(t=>t.u)).size} users transacting</span></div></div>
<div class="card"><h3>Recent transactions</h3>${tbl(TH,T.slice(0,8).map(txRow))}</div>`}
// users
function us(){$('v').innerHTML=`<div class="bar"><input id="q" placeholder="Search name, email, phone or ID" oninput="ut()" style="flex:1;min-width:200px"><select id="f" onchange="ut()"><option value="">All users</option><option value="active">Active</option><option value="blocked">Blocked</option></select></div><div class="card" id="t"></div>`;ut()}
function ut(){const q=$('q').value.toLowerCase(),f=$('f').value;$('t').innerHTML=tbl(['ID','Name','Email','Balance','Status','Joined'],U.filter(u=>(!f||u.status===f)&&(u.name+u.email+u.phone+u.id).toLowerCase().includes(q)).map(u=>`<tr class="c" onclick="openUser('${u.id}')"><td>${u.id}</td><td>${u.name}</td><td>${u.email}</td><td>${N(u.bal)}</td><td>${bd(u.status)}</td><td>${fd(u.joined).slice(0,6)}</td></tr>`))}
function drawer(h){let o=$('ov');if(!o){o=document.createElement('div');o.id='ov';o.className='ov';o.onclick=e=>{if(e.target===o)closeD()};document.body.appendChild(o)}o.innerHTML=`<div class="dw"><button class="btn g x" onclick="closeD()">Close</button>${h}</div>`}
function closeD(){const o=$('ov');if(o)o.remove()}
function openUser(id){const u=uu(id),h=[...T.filter(t=>t.u===id).map(t=>({ts:t.ts,a:`${t.ty} ${t.id}`,amt:(t.ty==='Deposit'?'+':'-')+N(t.amt),st:t.st})),...LG.filter(l=>l.u===id).map(l=>({ts:l.ts,a:'Ledger '+l.id+' · '+l.reason,amt:(l.dir==='credit'?'+':'-')+N(l.amt),st:'ledger'}))].sort((a,b)=>b.ts-a.ts).slice(0,12);
drawer(`<h3 style="font-size:17px">${u.name} ${bd(u.status)}</h3><div class="mu">${u.id} · ${u.email} · ${u.phone}</div><div class="k" style="margin:12px 0"><small>Wallet balance</small><b>${N(u.bal)}</b>${u.bal<cfg.lowUser?' <span class="bd pending">below alert threshold</span>':''}</div>
<div class="row"><button class="btn ${u.status==='active'?'d':''}" ${can('users.block')?'':'disabled title="Your role cannot block users"'} onclick="blk('${id}')">${u.status==='active'?'Block user':'Unblock user'}</button></div>
<div class="card"><h3>Adjust balance (ledger entry)</h3><div class="row"><select id="ad"><option value="credit">Credit</option><option value="debit">Debit</option></select><input id="aa" type="number" min="1" placeholder="Amount"></div><textarea id="ar" rows="2" placeholder="Reason (required, saved in the ledger)"></textarea><div class="row"><button class="btn" ${can('balance.adjust')?'':'disabled title="Your role cannot adjust balances"'} onclick="adj('${id}')">Post ledger entry</button></div></div>
<h3>History</h3>${tbl(['Date','Entry','Amount','Status'],h.map(x=>`<tr><td>${fd(x.ts)}</td><td>${x.a}</td><td class="${x.amt[0]==='+'?'cr':'dr'}">${x.amt}</td><td>${x.st==='ledger'?'<span class="mu">ledger</span>':bd(x.st)}</td></tr>`),'No history yet.')}`)}
function blk(id){const u=uu(id),b=u.status;u.status=b==='active'?'blocked':'active';log(b==='active'?'Blocked user':'Unblocked user',u.id+' '+u.name,'status: '+b,'status: '+u.status);toast(u.status==='blocked'?'User blocked':'User unblocked');openUser(id);if(view==='us')ut();else go(view)}
function adj(id){const u=uu(id),a=Math.round(+$('aa').value),d=$('ad').value,r=$('ar').value.trim();if(!(a>0))return toast('Enter an amount above zero');if(!r)return toast('Add a reason for this entry');if(d==='debit'&&a>u.bal)return toast('Debit is larger than the balance');
const b=u.bal;u.bal+=d==='credit'?a:-a;const l={id:'L'+(9000+LG.length+1),u:id,ts:Date.now(),dir:d,amt:a,reason:r};LG.push(l);log('Ledger adjustment '+l.id,u.id+' '+u.name,'balance '+N(b),'balance '+N(u.bal)+' ('+d+' '+N(a)+': '+r+')');toast('Ledger entry posted');openUser(id);if(view==='us')ut()}
// transactions
function tx(){$('v').innerHTML=`<div class="bar"><input id="q" placeholder="ID or user" oninput="xt()" style="flex:1;min-width:150px"><select id="ty" onchange="xt()"><option value="">All types</option>${Object.keys(TY).map(k=>`<option>${k}</option>`).join('')}</select><select id="s" onchange="xt()"><option value="">All statuses</option><option>success</option><option>pending</option><option>failed</option></select></div><div class="bar mu"><label>From <input id="d1" type="date" onchange="xt()"></label><label>To <input id="d2" type="date" onchange="xt()"></label><input id="m1" type="number" placeholder="Min ₦" oninput="xt()" style="width:110px"><input id="m2" type="number" placeholder="Max ₦" oninput="xt()" style="width:110px"></div><div class="card" id="t"></div>`;xt()}
function xt(){const q=$('q').value.toLowerCase(),ty=$('ty').value,s=$('s').value,a=$('d1').value?new Date($('d1').value).getTime():0,b=$('d2').value?new Date($('d2').value).getTime()+D:1/0,m1=+$('m1').value||0,m2=+$('m2').value||1/0;
const r=T.filter(t=>(!ty||t.ty===ty)&&(!s||t.st===s)&&t.ts>=a&&t.ts<b&&t.amt>=m1&&t.amt<=m2&&(t.id+uu(t.u).name+t.u).toLowerCase().includes(q));$('t').innerHTML=`<p class="mu">${r.length} transactions</p>`+tbl(TH,r.slice(0,60).map(txRow))}
// analytics
function an(){const days=[...Array(14)].map((_,i)=>{const s=day0-(13-i)*D;return{s,v:T.filter(t=>t.st==='success'&&t.ts>=s&&t.ts<s+D).reduce((a,t)=>a+t.amt,0)}}),mx=Math.max(...days.map(d=>d.v),1);
const svg=`<svg viewBox="0 0 560 170" width="100%" role="img" aria-label="Successful transaction volume for the last 14 days">${days.map((d,i)=>`<rect x="${i*40+6}" y="${150-d.v/mx*140}" width="28" height="${d.v/mx*140}" rx="3" fill="var(--pr)"><title>${new Date(d.s).toDateString()}: ${N(d.v)}</title></rect><text x="${i*40+20}" y="166" font-size="10" text-anchor="middle" fill="var(--mu)">${new Date(d.s).getDate()}</text>`).join('')}</svg>`;
const ag={};T.forEach(t=>{const a=ag[t.u]=ag[t.u]||{n:0,v:0};a.n++;if(t.st==='success')a.v+=t.amt});const tp=k=>Object.entries(ag).sort((a,b)=>b[1][k]-a[1][k]).slice(0,5).map(([id,a])=>`<tr class="c" onclick="openUser('${id}')"><td>${uu(id).name}</td><td>${a.n}</td><td>${N(a.v)}</td></tr>`);
const c=x=>T.filter(t=>t.st===x).length,p=x=>(c(x)/T.length*100).toFixed(1),op=CS.filter(c=>c.st==='open'||c.st==='reviewing');
$('v').innerHTML=`<div class="card"><h3>Successful volume, last 14 days</h3>${svg}</div><div class="two"><div class="card"><h3>Top users by count</h3>${tbl(['User','Count','Value'],tp('n'))}</div><div class="card"><h3>Top users by value</h3>${tbl(['User','Count','Value'],tp('v'))}</div></div>
<div class="card"><h3>Success vs failure</h3><div style="display:flex;height:16px;border-radius:8px;overflow:hidden"><i style="width:${p('success')}%;background:var(--ok)"></i><i style="width:${p('pending')}%;background:var(--wa)"></i><i style="width:${p('failed')}%;background:var(--er)"></i></div><div class="row mu"><span class="cr">Success ${p('success')}%</span><span>Pending ${p('pending')}%</span><span class="dr">Failed ${p('failed')}%</span></div></div>
<div class="card"><h3>Risk alerts</h3>${op.length?tbl(['Case','User','Flag','Detail'],op.slice(0,5).map(x=>`<tr class="c" onclick="openCase('${x.id}')"><td>${x.id}</td><td>${uu(x.u).name}</td><td>${x.kind}</td><td>${x.detail}</td></tr>`)):'<p class="mu">No open alerts.</p>'}</div>`}
// risk
function rk(){$('v').innerHTML=`<div class="bar"><select id="f" onchange="rt()"><option value="">All cases</option><option>open</option><option>reviewing</option><option>resolved</option><option>dismissed</option></select><span class="mu">Flags: 5+ transactions in 10 minutes, or a large amount over 4× the user's average.</span></div><div class="card" id="t"></div>`;rt()}
function rt(){const f=$('f').value;$('t').innerHTML=tbl(['Case','User','Flag','Detail','Status','Raised'],CS.filter(c=>!f||c.st===f).map(c=>`<tr class="c" onclick="openCase('${c.id}')"><td>${c.id}</td><td>${uu(c.u).name}</td><td>${c.kind}</td><td>${c.detail}</td><td>${bd(c.st)}</td><td>${fd(c.ts)}</td></tr>`))}
function openCase(id){const c=CS.find(x=>x.id===id),done=c.st==='resolved'||c.st==='dismissed',dis=can('cases.resolve')?'':'disabled title="Your role cannot resolve cases"';
drawer(`<h3 style="font-size:17px">${c.id} · ${c.kind} ${bd(c.st)}</h3><p>${c.detail}</p><p class="mu">User: <a href="#" onclick="openUser('${c.u}');return false">${uu(c.u).name}</a> · ${fd(c.ts)}</p>
<h3>Recent activity</h3>${tbl(TH.slice(2),T.filter(t=>t.u===c.u).slice(0,6).map(t=>`<tr><td>${t.ty}</td><td>${N(t.amt)}</td><td>${bd(t.st)}</td><td>${fd(t.ts)}</td></tr>`))}
<h3 style="margin-top:14px">Notes</h3>${c.notes.map(n=>`<p><span class="mu">${fd(n.ts)} · ${n.who}</span><br>${n.t}</p>`).join('')||'<p class="mu">No notes yet.</p>'}
<textarea id="cn" rows="3" placeholder="Add a note. A note is required to resolve or dismiss."></textarea><div class="row"><button class="btn g" ${dis} onclick="cs('${id}',null)">Add note</button>${done?'':`<button class="btn g" ${dis} onclick="cs('${id}','reviewing')">Start review</button><button class="btn" ${dis} onclick="cs('${id}','resolved')">Resolve</button><button class="btn g" ${dis} onclick="cs('${id}','dismissed')">Dismiss as false alarm</button>`}</div>`)}
function cs(id,s){const c=CS.find(x=>x.id===id),t=$('cn').value.trim();if((s==='resolved'||s==='dismissed')&&!t)return toast('Add a note to close this case');if(t)c.notes.push({ts:Date.now(),who:role,t});const b=c.st;if(s)c.st=s;log(s?`Case ${s}`:'Case note added',c.id+' '+c.kind,'status: '+b,'status: '+c.st+(t?' · note: '+t:''));toast('Saved');openCase(id);if(view==='rk')rt();go(view)}
// audit
function au(){$('v').innerHTML=`<div class="card">${tbl(['When','Who','Action','Target','Before','After','IP'],AU.map(a=>`<tr><td>${fd(a.ts)}</td><td>${a.who}</td><td>${a.action}</td><td>${a.target}</td><td>${a.before}</td><td style="white-space:normal;min-width:220px">${a.after}</td><td>${a.ip}</td></tr>`),'No admin actions yet. Block a user, adjust a balance or change a setting and it will appear here.')}</div>`}
// settings
const CL={minFund:'Minimum funding',maxFund:'Maximum funding',dailyWd:'Daily withdrawal limit',perTx:'Maximum per transaction',lowUser:'User low-balance alert',lowProv:'Provider low-balance alert'};
function st(){const e=can('settings.edit');$('v').innerHTML=`<div class="card"><h3>Transaction limits and alerts (₦)</h3><div class="f">${Object.keys(CL).map(k=>`<label for="c_${k}">${CL[k]}</label><input id="c_${k}" type="number" min="0" value="${cfg[k]}" ${e?'':'disabled'}>`).join('')}</div><div class="row"><button class="btn" ${e?'':'disabled title="Your role cannot edit settings"'} onclick="sv()">Save changes</button></div></div>
<div class="card"><h3>Roles and permissions</h3>${tbl(['Permission',...Object.keys(roles)],Object.keys(PN).map(p=>`<tr><td>${PN[p]}</td>${Object.keys(roles).map(r=>`<td><input type="checkbox" aria-label="${r}: ${PN[p]}" ${roles[r].includes(p)?'checked':''} ${can('roles.edit')&&r!=='Super admin'?'':'disabled'} onchange="rp('${r}','${p}',this.checked)"></td>`).join('')}</tr>`))}<p class="mu">Switch the role at the top to see how each one is limited. Super admin always keeps every permission.</p></div>`}
function sv(){const ch=[];for(const k in CL){const v=Math.round(+$('c_'+k).value);if(v<0||isNaN(v))return toast(CL[k]+' must be zero or more');if(v!==cfg[k])ch.push([k,cfg[k],v])}
if(+$('c_minFund').value>+$('c_maxFund').value)return toast('Minimum funding must not exceed maximum funding');if(!ch.length)return toast('No changes to save');
ch.forEach(([k,a,b])=>{cfg[k]=b;log('Setting changed',CL[k],N(a),N(b))});toast('Settings saved')}
function rp(r,p,on){const b=roles[r].includes(p);roles[r]=on?[...roles[r],p]:roles[r].filter(x=>x!==p);log('Permission changed',r+' · '+PN[p],b?'granted':'not granted',on?'granted':'not granted');toast('Permission updated')}
// data plans
const SZ=['500MB','1GB','2GB','3GB','5GB'],PL={};['MTN','Airtel','Glo','9mobile'].forEach((n,i)=>PL[n]=SZ.map((s,j)=>({s,p:[150,300,600,900,1500][j]+i*10*(j+1),d:30})));
function dp(){const e=can('plans.edit');$('v').innerHTML=`<p class="mu">Set what users pay for each direct data plan and how long it lasts. ${e?'':'Your role can view prices but not change them.'}</p>`+Object.keys(PL).map(n=>`<div class="card"><h3>${n}</h3>${tbl(['Plan','Price (₦)','Duration (days)'],PL[n].map((x,j)=>`<tr><td>${x.s}</td><td><input id="p_${n}_${j}" type="number" min="1" value="${x.p}" aria-label="${n} ${x.s} price" style="width:120px" ${e?'':'disabled'}></td><td><input id="d_${n}_${j}" type="number" min="1" value="${x.d}" aria-label="${n} ${x.s} duration in days" style="width:100px" ${e?'':'disabled'}></td></tr>`))}</div>`).join('')+`<button class="btn" ${e?'':'disabled title="Only roles with the data plan permission can edit prices"'} onclick="dsv()">Save plan prices</button>`}
function dsv(){const ch=[];for(const n in PL)for(let j=0;j<PL[n].length;j++){const x=PL[n][j],p=Math.round(+$(`p_${n}_${j}`).value),d=Math.round(+$(`d_${n}_${j}`).value);if(!(p>0)||!(d>=1))return toast(`${n} ${x.s}: enter a price and a duration of at least 1 day`);if(p!==x.p||d!==x.d)ch.push([n,x,p,d])}
if(!ch.length)return toast('No changes to save');ch.forEach(([n,x,p,d])=>{log('Data plan changed',n+' '+x.s,N(x.p)+' · '+x.d+' days',N(p)+' · '+d+' days');x.p=p;x.d=d});toast(ch.length+' plan'+(ch.length>1?'s':'')+' updated')}
go('ov');
</script></body></html>
